<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07050c"/>
      <stop offset=".42" stop-color="#1c0911"/>
      <stop offset=".66" stop-color="#4f1010"/>
      <stop offset=".8" stop-color="#9a2a0e"/>
      <stop offset=".9" stop-color="#d4561a"/>
      <stop offset="1" stop-color="#2a0806"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff5a2a" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#c1121f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c1121f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".42" cy=".38">
      <stop offset="0" stop-color="#ff8a4a"/>
      <stop offset=".55" stop-color="#e0301e"/>
      <stop offset="1" stop-color="#8e0f12"/>
    </radialGradient>
    <radialGradient id="fire" cx=".5" cy="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#ff5a1f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <g id="nobori-red">
      <line x1="0" y1="0" x2="0" y2="300" stroke="#0b0606" stroke-width="5"/>
      <line x1="-2" y1="8" x2="54" y2="8" stroke="#0b0606" stroke-width="5"/>
      <rect x="4" y="10" width="48" height="170" fill="#8f1d14"/>
      <circle cx="28" cy="48" r="15" fill="none" stroke="#f3e6c8" stroke-width="4"/>
      <circle cx="28" cy="48" r="5" fill="#f3e6c8"/>
      <rect x="10" y="80" width="36" height="3" fill="#f3e6c8" opacity=".7"/>
    </g>
    <g id="nobori-black">
      <line x1="0" y1="0" x2="0" y2="300" stroke="#0b0606" stroke-width="5"/>
      <line x1="-2" y1="8" x2="54" y2="8" stroke="#0b0606" stroke-width="5"/>
      <rect x="4" y="10" width="48" height="170" fill="#141010"/>
      <g fill="#c9a14a">
        <circle cx="28" cy="40" r="6"/><circle cx="18" cy="58" r="6"/><circle cx="38" cy="58" r="6"/>
      </g>
      <rect x="10" y="84" width="36" height="3" fill="#c9a14a" opacity=".7"/>
    </g>
    <g id="yari">
      <line x1="0" y1="0" x2="0" y2="240" stroke="#070404" stroke-width="3"/>
      <path d="M0 -26 L5 0 L-5 0 Z" fill="#070404"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>

  <!-- 星 -->
  <g fill="#fff" opacity=".55">
    <circle cx="120" cy="80" r="1.6"/><circle cx="310" cy="160" r="1.2"/><circle cx="460" cy="60" r="1.8"/>
    <circle cx="590" cy="190" r="1.1"/><circle cx="1040" cy="90" r="1.5"/><circle cx="1180" cy="200" r="1.2"/>
    <circle cx="1330" cy="70" r="1.7"/><circle cx="1490" cy="170" r="1.3"/><circle cx="220" cy="260" r="1"/>
    <circle cx="1420" cy="300" r="1"/><circle cx="880" cy="40" r="1.3"/>
  </g>

  <!-- 赤い月 -->
  <circle cx="760" cy="430" r="420" fill="url(#glow)"/>
  <circle cx="760" cy="430" r="170" fill="url(#moon)"/>
  <!-- 月にかかる雲 -->
  <g fill="#0a0608">
    <path d="M500 400 Q640 382 760 396 T1030 392 Q900 412 760 414 T500 400 Z" opacity=".75"/>
    <path d="M580 478 Q700 466 820 474 T1080 472 Q940 490 820 492 T580 478 Z" opacity=".6"/>
    <path d="M160 220 Q300 200 430 214 T640 208 Q520 230 400 232 T160 220 Z" opacity=".5"/>
    <path d="M1060 250 Q1200 232 1320 244 T1560 240 Q1430 262 1300 262 T1060 250 Z" opacity=".5"/>
  </g>

  <!-- 遠くの山 -->
  <path d="M0 760 L140 690 L260 730 L400 650 L520 715 L640 670 L760 720 L900 640 L1040 705 L1180 660 L1320 720 L1460 670 L1600 720 L1600 1200 L0 1200 Z" fill="#3a0e10" opacity=".85"/>
  <path d="M0 820 L180 760 L320 800 L470 740 L600 790 L740 760 L880 800 L1020 750 L1160 790 L1300 755 L1450 800 L1600 770 L1600 1200 L0 1200 Z" fill="#220a0c"/>

  <!-- 城の丘 -->
  <path d="M520 900 Q640 820 820 812 Q1000 820 1120 900 Z" fill="#120607"/>

  <!-- 天守閣 -->
  <g fill="#0b0506">
    <path d="M690 830 L950 830 L930 772 L710 772 Z"/>
    <rect x="726" y="722" width="188" height="52"/>
    <path d="M688 728 Q700 712 726 708 L914 708 Q940 712 952 728 Q930 718 914 720 L726 720 Q710 718 688 728 Z"/>
    <rect x="752" y="664" width="136" height="46"/>
    <path d="M716 670 Q730 652 752 650 L888 650 Q910 652 924 670 Q906 660 888 662 L752 662 Q734 660 716 670 Z"/>
    <path d="M790 650 Q820 626 850 650 Z"/>
    <rect x="776" y="608" width="88" height="44"/>
    <path d="M748 614 Q760 598 778 596 L862 596 Q880 598 892 614 Q878 606 862 608 L778 608 Q762 606 748 614 Z"/>
    <rect x="794" y="566" width="52" height="32"/>
    <path d="M770 572 Q784 552 800 550 L840 550 Q856 552 870 572 Q856 562 840 564 L800 564 Q784 562 770 572 Z"/>
    <path d="M796 552 L800 536 L806 552 Z"/>
    <path d="M834 552 L840 536 L844 552 Z"/>
  </g>
  <!-- 城の灯り -->
  <g fill="#ff9a3c" opacity=".85">
    <rect x="748" y="738" width="10" height="14"/><rect x="786" y="738" width="10" height="14"/><rect x="844" y="738" width="10" height="14"/><rect x="882" y="738" width="10" height="14"/>
    <rect x="776" y="678" width="9" height="12"/><rect x="815" y="678" width="9" height="12"/><rect x="855" y="678" width="9" height="12"/>
    <rect x="800" y="620" width="8" height="11"/><rect x="832" y="620" width="8" height="11"/>
  </g>

  <!-- 地平線の炎 -->
  <ellipse cx="300" cy="960" rx="380" ry="150" fill="url(#fire)"/>
  <ellipse cx="1320" cy="970" rx="420" ry="160" fill="url(#fire)"/>
  <ellipse cx="820" cy="990" rx="300" ry="110" fill="url(#fire)" opacity=".7"/>

  <!-- 手前の丘 -->
  <path d="M0 960 Q220 900 460 930 Q700 960 820 940 Q1000 905 1200 930 Q1420 958 1600 920 L1600 1200 L0 1200 Z" fill="#060304"/>

  <!-- 槍の列 -->
  <g>
    <use href="#yari" x="40" y="880"/><use href="#yari" x="70" y="900"/><use href="#yari" x="100" y="872"/>
    <use href="#yari" x="130" y="895"/><use href="#yari" x="160" y="878"/><use href="#yari" x="190" y="900"/>
    <use href="#yari" x="380" y="900"/><use href="#yari" x="410" y="884"/><use href="#yari" x="440" y="905"/>
    <use href="#yari" x="470" y="888"/><use href="#yari" x="500" y="910"/>
    <use href="#yari" x="1120" y="895"/><use href="#yari" x="1150" y="878"/><use href="#yari" x="1180" y="900"/>
    <use href="#yari" x="1210" y="884"/><use href="#yari" x="1240" y="906"/>
    <use href="#yari" x="1400" y="874"/><use href="#yari" x="1430" y="896"/><use href="#yari" x="1460" y="880"/>
    <use href="#yari" x="1490" y="900"/><use href="#yari" x="1520" y="884"/><use href="#yari" x="1550" y="904"/>
  </g>

  <!-- のぼり旗 -->
  <use href="#nobori-red" x="230" y="800"/>
  <use href="#nobori-black" x="300" y="830"/>
  <use href="#nobori-red" x="560" y="840"/>
  <use href="#nobori-black" x="620" y="868"/>
  <use href="#nobori-red" x="1000" y="852"/>
  <use href="#nobori-black" x="1062" y="826"/>
  <use href="#nobori-red" x="1290" y="810"/>
  <use href="#nobori-black" x="1350" y="838"/>

  <!-- いちばん手前 -->
  <path d="M0 1060 Q300 1020 620 1050 Q900 1080 1200 1040 Q1420 1015 1600 1050 L1600 1200 L0 1200 Z" fill="#030202"/>
</svg>
